name: CI

permissions:
  contents: read

# Branches other than main run once, as their pull request; main runs on push and publishes the image.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The committed openapi.json must match the route table.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      # --porcelain also catches files the generators added that aren't committed yet.
      - name: Generated files are current
        run: test -z "$(git status --porcelain)" || { git status --short; echo "::error::Generated files are stale. Run npm run generate and commit."; exit 1; }
      - run: npx -y @redocly/cli@2.57.0 lint openapi.json

  # Runs against `next dev`: the test sign-in is compiled out of production builds.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; its system libraries still come from apt.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Kept for a run that passed too: a test that failed once and passed on its retry leaves its trace only here.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event_name }}
          path: playwright-report/
          retention-days: 14

  # The image has no shell, so its entrypoint and health check are Node code that only a running container exercises.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: freundebuch:smoke
          cache-from: type=gha,scope=linux/amd64
      - name: Starts on the runner's folder and turns healthy
        run: |
          mkdir data
          docker run -d --name freundebuch -p 3000:3000 -v "$PWD/data:/data" \
            -e PUBLIC_URL=http://localhost:3000 \
            -e FREUNDEBUCH_OIDC_ISSUER=https://authentik.example.com/application/o/freundebuch/ \
            -e FREUNDEBUCH_OIDC_CLIENT_ID=smoke -e FREUNDEBUCH_OIDC_CLIENT_SECRET=smoke \
            freundebuch:smoke
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' freundebuch)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' freundebuch | grep -qx healthy || { docker logs freundebuch; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)" = 200

  # Pushes to main publish :main for amd64 and arm64. Each platform builds natively on its own runner (arm64 under emulation
  # took four minutes for `next build` alone), pushes by digest, and `image` joins the two into one tag.
  image-build:
    needs: [check, generate, e2e, image-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/marceltov/freundebuch,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest for the tag
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  image:
    needs: [image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as :main
        working-directory: digests
        run: docker buildx imagetools create -t ghcr.io/marceltov/freundebuch:main $(printf 'ghcr.io/marceltov/freundebuch@sha256:%s ' *)
