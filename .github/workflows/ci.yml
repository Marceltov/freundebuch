name: CI

permissions:
  contents: read

# Branches other than main run once, as their pull request; main runs on push and publishes the image.
# A version tag (v1.2.3) runs too, publishes the image under its version and makes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "mkdocs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "mkdocs.yml"]

# A new push to a pull request cancels the run it supersedes; main runs every push to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The committed openapi.json must match the route table.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      # --porcelain also catches files the generators added that aren't committed yet.
      - name: Generated files are current
        run: test -z "$(git status --porcelain)" || { git status --short; echo "::error::Generated files are stale. Run npm run generate and commit."; exit 1; }
      - run: npx -y @redocly/cli@2.57.0 lint openapi.json

  # Runs against `next dev`: the test sign-in is compiled out of production builds.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; its system libraries still come from apt.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Kept for a run that passed too: a test that failed once and passed on its retry leaves its trace only here.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event_name }}
          path: playwright-report/
          retention-days: 14

  # The image has no shell, so its entrypoint and health check are Node code that only a running container exercises.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: freundebuch:smoke
          cache-from: type=gha,scope=linux/amd64
      - name: Starts on the runner's folder and turns healthy
        run: |
          mkdir data
          docker run -d --name freundebuch -p 3000:3000 -v "$PWD/data:/data" \
            -e PUBLIC_URL=http://localhost:3000 \
            -e FREUNDEBUCH_OIDC_ISSUER=https://authentik.example.com/application/o/freundebuch/ \
            -e FREUNDEBUCH_OIDC_CLIENT_ID=smoke -e FREUNDEBUCH_OIDC_CLIENT_SECRET=smoke \
            freundebuch:smoke
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' freundebuch)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' freundebuch | grep -qx healthy || { docker logs freundebuch; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)" = 200

  # Pushes to main publish :main for amd64 and arm64, a version tag publishes its version. Each platform builds natively on its own runner (arm64 under emulation
  # took four minutes for `next build` alone), pushes by digest, and `image` joins the two into one tag. The builds run
  # alongside the tests; only the tag waits for them, so an untested image is never :main.
  image-build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/marceltov/freundebuch,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest for the tag
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  image:
    needs: [image-build, check, generate, e2e, image-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 is :1.2.3, :1.2 and :latest; a pre-release (v1.2.3-rc.1) gets only its own tag.
      - name: Tag both platforms
        working-directory: digests
        run: |
          image=ghcr.io/marceltov/freundebuch
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            tags="-t $image:$version"
            [[ $version == *-* ]] || tags="$tags -t $image:${version%.*} -t $image:latest"
          else
            tags="-t $image:main"
          fi
          docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)

  # The release notes list the pull requests since the previous tag; the same notes go to the notefeed feed.
  # Both steps skip what a previous run of the same tag already made, so a re-run doesn't post twice.
  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write the release notes
        run: |
          version=${TAG#v}
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          printf '\n### Image\n\n```sh\ndocker pull ghcr.io/marceltov/freundebuch:%s\n```\n' "$version" >> notes.md
      - name: Make the GitHub release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && { echo "Release $TAG exists"; exit 0; }
          prerelease=; [[ $TAG == *-* ]] && prerelease=--prerelease
          gh release create "$TAG" --verify-tag --title "freundebuch ${TAG#v}" --notes-file notes.md $prerelease
      - name: Post the notes to notefeed
        env:
          NOTEFEED_URL: https://notefeed.me
          NOTEFEED_FEED: ${{ secrets.NOTEFEED_FEED }}
          NOTEFEED_FEED_PASSWORD: ${{ secrets.NOTEFEED_FEED_PASSWORD }}
        run: |
          feed="$NOTEFEED_URL/api/v1/feeds/$NOTEFEED_FEED/notes"
          posted=$(curl -fsS -H "X-Feed-Password: $NOTEFEED_FEED_PASSWORD" "$feed?tag=$TAG&limit=1" | jq '.notes | length')
          [ "$posted" = 0 ] || { echo "$TAG is already on notefeed"; exit 0; }
          printf '\n[The release on GitHub](%s)\n' "$(gh release view "$TAG" --json url --jq .url)" >> notes.md
          curl -fsS -o /dev/null -H "Content-Type: text/markdown" -H "X-Feed-Password: $NOTEFEED_FEED_PASSWORD" \
            -H "X-Note-Title: freundebuch ${TAG#v}" -H "X-Note-Tags: release,$TAG" \
            --data-binary @notes.md "$feed"
