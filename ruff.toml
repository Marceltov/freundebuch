# Marceltov/engineering-conventions: code/formatting.md. Copy into a Python project's root.
line-length = 160  # 160 everywhere: .editorconfig, .prettierrc.json, ruff.toml

[lint]
# pycodestyle, Pyflakes, import order, pyupgrade, bugbear, simplify, Ruff's own rules.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[format]
docstring-code-format = true
